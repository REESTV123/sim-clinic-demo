<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CallReady · Call results</title>
<link rel="icon" href="reestv-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="callready.css">
<style>
  main { max-width: 980px; }
  .back { display: inline-block; margin: 0 0 20px; color: var(--muted); text-decoration: none; font-size: 15px; }
  .back::before { content: "← "; color: var(--teal); }
  .back:hover { color: var(--teal); }
  h1.title { font-size: clamp(36px, 7vw, 52px); line-height: 1.05; margin: 0 0 8px; font-weight: 900; letter-spacing: -0.03em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  select {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px;
  }
  .msg { color: var(--miss); min-height: 1.5em; margin-top: 10px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tabs button[aria-selected="true"] {
    color: var(--bg); font-weight: 600; border-color: transparent;
    background: linear-gradient(90deg, var(--teal), var(--teal-2));
  }

  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .totals { color: var(--muted); }
  .totals strong { color: var(--teal); font-size: 1.2rem; font-weight: 800; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }

  #list.card { padding: 4px 22px; }
  .call { border-top: 1px solid var(--line); }
  .call:first-child { border-top: 0; }
  .call summary {
    list-style: none; cursor: pointer; padding: 16px 0;
    display: grid; grid-template-columns: 9.5rem 1fr auto auto; gap: 16px; align-items: center; font-weight: 400;
  }
  .call summary::-webkit-details-marker { display: none; }
  .call[open] summary { border-bottom: 1px dashed var(--line); }
  .when { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 15px; }
  .who strong { display: block; font-weight: 700; }
  .who span { color: var(--muted); font-size: 0.9rem; }
  .score { font-weight: 800; color: var(--teal); font-variant-numeric: tabular-nums; min-width: 3.5rem; text-align: right; }

  /* The criteria strip: one mark per criterion, in order. Met = bright teal, missed = orange, not assessed = dark. */
  .strip { display: flex; gap: 3px; }
  .strip i { width: 10px; height: 22px; border-radius: 3px; background: #1E3A3E; }
  .strip i.yes { background: var(--teal); box-shadow: 0 0 6px rgba(25, 227, 210, 0.5); }
  .strip i.no { background: var(--miss); }

  .detail { padding: 16px 0 22px; display: grid; gap: 20px; }
  .crit { display: grid; grid-template-columns: 4.5rem 1fr; gap: 6px 12px; margin: 0; }
  .crit dt { font-weight: 700; font-size: 0.9rem; }
  .crit dt.yes { color: var(--teal); } .crit dt.no { color: var(--miss); } .crit dt.na { color: var(--faint); }
  .crit dd { margin: 0; }
  .field h3 { font-size: 12px; margin: 0 0 4px; color: var(--teal); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .field p { margin: 0; max-width: 72ch; white-space: pre-wrap; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 0; }
  details.call { padding: 0; }
  details.call:last-of-type { border-bottom: 0; }

  @media (max-width: 640px) {
    .call summary { grid-template-columns: 1fr auto; }
    .when { grid-column: 1 / -1; }
    .strip { grid-column: 1 / -1; order: 5; }
    #list.card { padding: 4px 16px; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="wordmark" href="./">Call<span class="ready">Ready</span></a>
    <span class="by"><span>by</span><img src="reestv-logo.png" alt="REESTV" width="58" height="36"></span>
  </header>

  <a class="back" href="./">Back to CallReady</a>
  <h1 class="title">Call results</h1>
  <p class="sub">Every CallReady practice call, scored against the product’s criteria.</p>

  <p class="msg" id="gateMsg" role="alert">Loading…</p>

  <section id="results" hidden>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="bar">
      <div class="totals" id="totals"></div>
      <div class="controls">
        <select id="doctorFilter" aria-label="Filter by doctor"></select>
        <button id="refresh">Refresh</button>
      </div>
    </div>
    <div id="list" class="card"></div>
  </section>

  <footer class="foot">
    <p>CallReady is built by REESTV · <a href="https://www.callready.com.au">www.callready.com.au</a></p>
  </footer>
</main>

<script>
// Paste your Worker address here after deploying it.
const API_URL = 'https://sim-clinic-results.reestv.workers.dev';

let data = null;
let activeTab = 0;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

$('refresh').addEventListener('click', load);
$('doctorFilter').addEventListener('change', renderList);

async function load() {
  $('refresh').disabled = true;
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || 'The results didn’t load.');
    data = json;
    $('gateMsg').textContent = '';
    $('results').hidden = false;
    renderTabs();
  } catch (err) {
    $('results').hidden = true;
    $('gateMsg').textContent = err.message.includes('fetch')
      ? 'The results service couldn’t be reached. If you’re on a company network, it may be blocked.'
      : err.message;
  } finally {
    $('refresh').disabled = false;
  }
}

load();

// Work out which column is which from the header names and contents.
function describe(tab) {
  const h = tab.headers.map((x) => x.toLowerCase());
  const find = (re) => h.findIndex((x) => re.test(x));
  const isVerdict = (v) => /^(yes|no|n\/?a|success|failure|unknown)$/i.test(v.trim());
  const criteria = tab.headers.map((_, i) => i).filter((i) => {
    const vals = tab.rows.map((r) => r[i] || '').filter((v) => v !== '');
    return vals.length > 0 && vals.filter(isVerdict).length / vals.length > 0.8;
  });
  const when = find(/date|time/);
  const doctor = find(/doctor/);
  const level = find(/adoption|level|ladder/);
  const score = find(/score/);
  const hide = new Set([when, doctor, level, score, ...criteria]);
  h.forEach((x, i) => { if (/conversation|call id|^id$/.test(x)) hide.add(i); });
  const text = tab.headers.map((_, i) => i).filter((i) => !hide.has(i));
  return { when, doctor, level, score, criteria, text };
}

function verdictClass(v) {
  const t = (v || '').trim().toLowerCase();
  if (t === 'yes' || t === 'success') return 'yes';
  if (t === 'no' || t === 'failure') return 'no';
  return 'na';
}

function renderTabs() {
  const tabs = $('tabs');
  tabs.replaceChildren();
  if (activeTab >= data.tabs.length) activeTab = 0;
  data.tabs.forEach((t, i) => {
    const b = el('button', '', t.name);
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === activeTab ? 'true' : 'false');
    b.addEventListener('click', () => { activeTab = i; renderTabs(); });
    tabs.append(b);
  });
  const tab = data.tabs[activeTab];
  const cols = describe(tab);
  const sel = $('doctorFilter');
  const prev = sel.value;
  sel.replaceChildren(new Option('All doctors', ''));
  if (cols.doctor >= 0) {
    [...new Set(tab.rows.map((r) => r[cols.doctor]).filter(Boolean))].sort()
      .forEach((d) => sel.append(new Option(d, d)));
  }
  sel.value = [...sel.options].some((o) => o.value === prev) ? prev : '';
  sel.hidden = cols.doctor < 0;
  renderList();
}

function renderList() {
  const tab = data.tabs[activeTab];
  const cols = describe(tab);
  const doc = $('doctorFilter').value;
  const rows = tab.rows
    .filter((r) => !doc || r[cols.doctor] === doc)
    .slice().reverse(); // newest first

  // Totals
  const pct = rows.map((r) => {
    const m = cols.score >= 0 && String(r[cols.score]).match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
    return m && +m[2] > 0 ? +m[1] / +m[2] : null;
  }).filter((x) => x != null);
  const totals = $('totals');
  totals.replaceChildren();
  const n = el('strong', '', String(rows.length));
  totals.append(n, ` call${rows.length === 1 ? '' : 's'}`);
  if (pct.length) {
    const avg = Math.round((pct.reduce((a, b) => a + b, 0) / pct.length) * 100);
    totals.append(', average score ', el('strong', '', avg + '%'));
  }

  const list = $('list');
  list.replaceChildren();
  if (!rows.length) {
    list.append(el('p', 'empty', 'No calls logged yet. Results appear here a minute or two after a practice call ends.'));
    return;
  }

  rows.forEach((r) => {
    const d = el('details', 'call');
    const s = el('summary');
    s.append(el('span', 'when', cols.when >= 0 ? r[cols.when] : ''));
    const who = el('span', 'who');
    who.append(el('strong', '', cols.doctor >= 0 ? r[cols.doctor] : tab.name));
    if (cols.level >= 0 && r[cols.level]) who.append(el('span', '', r[cols.level]));
    s.append(who);
    const strip = el('span', 'strip');
    strip.setAttribute('aria-hidden', 'true');
    cols.criteria.forEach((i) => strip.append(el('i', verdictClass(r[i]))));
    s.append(strip);
    s.append(el('span', 'score', cols.score >= 0 ? r[cols.score] : ''));
    d.append(s);

    const body = el('div', 'detail');
    if (cols.criteria.length) {
      const dl = el('dl', 'crit');
      cols.criteria.forEach((i) => {
        const v = r[i] || 'N/A';
        dl.append(el('dt', verdictClass(v), v), el('dd', '', tab.headers[i]));
      });
      body.append(dl);
    }
    cols.text.forEach((i) => {
      if (!r[i]) return;
      const f = el('div', 'field');
      f.append(el('h3', '', tab.headers[i]), el('p', '', r[i]));
      body.append(f);
    });
    d.append(body);
    list.append(d);
  });
}
</script>
</body>
</html>
